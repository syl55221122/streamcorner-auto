name: streamcorner scrape

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Scrape
        run: python scrape.py
        env:
          M3U_HOST: ${{ vars.M3U_HOST || '127.0.0.1:19926' }}

      - name: Commit results
        run: |
          git config user.name "streamcorner-bot"
          git config user.email "streamcorner-bot@users.noreply.github.com"
          git add all.m3u data/items.json data/payload.json
          git diff --cached --quiet || git commit -m "update $(date -u +%Y-%m-%dT%H:%M)"
          git push
